[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goglobe-backend"
version = "0.3.2"
description = "GoGlobe v0.3.1 API/BFF with explicit snapshot providers"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.7,<3", "jsonschema>=4.26,<5", "tzdata>=2025", "httpx>=0.27,<1", "rfc3339-validator>=0.1.4,<1", "rfc3986-validator>=0.1.1,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.contracts" = ["*.json"]
"app.integrations.snapshots" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
extend-exclude = ["build", "output", ".audit-dist"]
